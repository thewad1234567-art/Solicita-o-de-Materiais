<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solicitação de Materiais</title>
  <link rel="icon" type="image/png" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRZDqdnkkfQbPhCofrswyS-OckpizFGEXCBZ9CGmxDKVw&s=10">
  <style>
    /* ==========================================================
       ÁREA DE ESTILO (CORES E TAMANHOS) - EDITE AQUI SE QUISER
       ========================================================== */
    :root {
      --cor-principal: #0056b3;
      --cor-fundo: #f4f6f9;
      --cor-card: #ffffff;
      --imagem-fundo: url('Fundo1.png'); 
    }

    body {
      font-family: Arial, sans-serif;
      background-color: var(--cor-fundo);
      background-image: var(--imagem-fundo);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      margin: 0;
      min-height: 95vh;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      background-color: var(--cor-card);
      width: 100%;
      max-width: 700px;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(19, 0, 0, 0.1);
    }

    h2 {
      color: var(--cor-principal);
      margin-top: 0;
      text-align: center;
    }

    .protocolo-box {
      background-color: #e9ecef;
      padding: 12px;
      border-radius: 5px;
      text-align: center;
      font-weight: bold;
      font-size: 1.1em;
      color: #333;
      margin-bottom: 20px;
      border-left: 5px solid var(--cor-principal);
    }

    .campo {
      margin-bottom: 15px;
    }

    /* Linha com dois campos lado a lado */
    .linha-dupla {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    @media (max-width: 600px) {
      .linha-dupla {
        grid-template-columns: 1fr;
        gap: 0;
      }
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
      color: #333;
    }

    input[type="text"], select, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 14px;
      background-color: #fff;
    }

    input[type="file"] {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      background-color: #f8f9fa;
    }

    /* Estilo da caixa de múltipla seleção de e-mails */
    .lista-emails-box {
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 10px;
      background-color: #fff;
      max-height: 150px;
      overflow-y: auto;
    }

    .lista-emails-box.desabilitado {
      background-color: #e9ecef;
      color: #6c757d;
      font-size: 14px;
    }

    .item-email {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 4px;
      border-bottom: 1px solid #f1f1f1;
      font-weight: normal;
      cursor: pointer;
      margin-bottom: 0;
    }

    .item-email:last-child {
      border-bottom: none;
    }

    .item-email:hover {
      background-color: #f8f9fa;
    }

    .item-email input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
      margin: 0;
    }

    .ajuda-campo {
      display: block;
      margin-top: 4px;
      font-size: 12px;
      color: #6c757d;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: var(--cor-principal);
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      background-color: #999;
      cursor: not-allowed;
    }

    #mensagem-status {
      margin-top: 15px;
      padding: 12px;
      border-radius: 4px;
      display: none;
      text-align: center;
      font-weight: bold;
    }

    .sucesso { background-color: #d4edda; color: #155724; }
    .erro { background-color: #f8d7da; color: #721c24; }
  </style>
</head>
<body>

<div class="container">
  <h2>Solicitação de Materiais</h2>

  <div class="protocolo-box">
    Nº da Solicitação: <span id="numero-protocolo">Será gerado ao enviar</span>
  </div>

  <form id="form-solicitacao">
    
    <div class="campo">
      <label for="solicitante">Nome do Solicitante *</label>
      <input type="text" id="solicitante" required placeholder="Digite seu nome completo">
    </div>

    <!-- PROJETO -->
    <div class="campo">
      <label for="projeto">Projeto *</label>
      <select id="projeto" required>
        <option value="" disabled selected>Selecione o Projeto...</option>
        <option value="PortoCem">UTE - PortoCem</option>
        <option value="Novo Tempo">UTE - Novo Tempo Barcarena</option>
      </select>
    </div>

    <!-- E-MAILS PARA VALIDAÇÃO (MÚLTIPLA ESCOLHA) -->
    <div class="campo">
      <label>E-mails para Copia * <small style="font-weight: normal; color: #666;">(Marque um ou mais)</small></label>
      <div id="container-emails" class="lista-emails-box desabilitado">
        Selecione primeiro um Projeto...
      </div>
    </div>

    <!-- SETOR / OS E CENTRO DE CUSTO LADO A LADO -->
    <div class="linha-dupla">
      <div class="campo">
        <label for="setor">Ordem de Serviço (OS) *</label>
        <input type="text" id="setor" required placeholder="Ex: OS 1234 / -">
      </div>

      <div class="campo">
        <label for="centro-custo">Centro de Custo</label>
        <input type="text" id="centro-custo" placeholder="Ex: Operação / Manutenção">
      </div>
    </div>

    <div class="campo">
      <label for="material">Descrição do Material *</label>
      <textarea id="material" rows="3" required placeholder="Descreva o material, medida, modelo..."></textarea>
    </div>

    <div class="campo">
      <label for="quantidade">Quantidade e Unidade *</label>
      <input type="text" id="quantidade" required placeholder="Ex: 5 peças, 2 caixas, 10 metros">
    </div>

    <div class="campo">
      <label for="observacoes">Observações (Opcional)</label>
      <input type="text" id="observacoes" placeholder="Ex:Com Urgência, Sem Urgência, etc.">
    </div>

    <!-- ANEXO (OPCIONAL) -->
    <div class="campo">
      <label for="anexo">Anexo (Opcional — foto, desenho técnico, PDF ou planilha)</label>
      <input type="file" id="anexo" accept=".pdf,.png,.jpg,.jpeg,.webp,.xls,.xlsx,.csv,.doc,.docx">
      <small id="info-anexo" class="ajuda-campo">Tamanho máximo recomendado: 15 MB.</small>
    </div>

    <button type="submit" id="btn-enviar">Enviar Solicitação</button>
  </form>

  <div id="mensagem-status"></div>
</div>

<script>
  const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbwn0heFwzZA0vg7pgKuHetv2_HnExpQNADDDqvRprTp6zhRbAafpqA7sCDOKuod9GYN/exec";
  const TAMANHO_MAX_MB = 15;

  /* ==========================================================
     LISTA DE E-MAILS POR PROJETO - ADICIONE QUANTOS QUISER AQUI
     ========================================================== */
  const EMAILS_POR_PROJETO = {
    "PortoCem": [
      "andre.gabriel@ompower.us",
      "fabricio.silva@ompower.us",
      "pietra.rodrigues@ompower.us",
      "claudemir.menezes@ompower.us",
      "rafael.kogake@ompower.us",
      "luis.claudio@ompower.us"
    ],
    "Novo Tempo": [
      "andre.gabriel@ompower.us",
      "rodrigo.almeida@ompower.us",
      "pietra.rodrigues@ompower.us",
      "claudemir.menezes@ompower.us",
      "rafael.kogake@ompower.us",
      "luis.claudio@ompower.us",
      "mateus.silva@ompower.us"
    ]
  };

  const spanProtocolo = document.getElementById("numero-protocolo");
  const form = document.getElementById("form-solicitacao");
  const btnEnviar = document.getElementById("btn-enviar");
  const msgStatus = document.getElementById("mensagem-status");
  
  const selectProjeto = document.getElementById("projeto");
  const containerEmails = document.getElementById("container-emails");
  const inputSetor = document.getElementById("setor");
  const inputCentroCusto = document.getElementById("centro-custo");
  const inputAnexo = document.getElementById("anexo");
  const infoAnexo = document.getElementById("info-anexo");

  function lerArquivoComoBase64(arquivo) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const resultado = String(reader.result || "");
        const base64Puro = resultado.includes(",") ? resultado.split(",")[1] : resultado;
        resolve({
          nome: arquivo.name,
          tipo: arquivo.type || "application/octet-stream",
          base64: base64Puro
        });
      };
      reader.onerror = () => reject(new Error("Falha ao ler o arquivo anexado."));
      reader.readAsDataURL(arquivo);
    });
  }

  inputAnexo.addEventListener("change", function() {
    const arquivo = this.files[0];
    if (!arquivo) {
      infoAnexo.textContent = `Tamanho máximo recomendado: ${TAMANHO_MAX_MB} MB.`;
      infoAnexo.style.color = "#6c757d";
      return;
    }

    const tamanhoMB = arquivo.size / (1024 * 1024);
    if (tamanhoMB > TAMANHO_MAX_MB) {
      infoAnexo.textContent = `Arquivo muito grande (${tamanhoMB.toFixed(2)} MB). Máximo permitido: ${TAMANHO_MAX_MB} MB.`;
      infoAnexo.style.color = "#721c24";
      this.value = "";
    } else {
      infoAnexo.textContent = `Selecionado: ${arquivo.name} (${tamanhoMB.toFixed(2)} MB)`;
      infoAnexo.style.color = "#155724";
    }
  });

  // Gera os checkboxes de e-mail conforme o Projeto selecionado
  selectProjeto.addEventListener("change", function() {
    const projetoSelecionado = this.value;
    containerEmails.innerHTML = "";

    if (projetoSelecionado && EMAILS_POR_PROJETO[projetoSelecionado]) {
      containerEmails.classList.remove("desabilitado");

      EMAILS_POR_PROJETO[projetoSelecionado].forEach((email, index) => {
        const label = document.createElement("label");
        label.className = "item-email";
        label.htmlFor = `chk-email-${index}`;

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.id = `chk-email-${index}`;
        checkbox.name = "emailsValidacao";
        checkbox.value = email;

        const texto = document.createElement("span");
        texto.textContent = email;

        label.appendChild(checkbox);
        label.appendChild(texto);
        containerEmails.appendChild(label);
      });
    } else {
      containerEmails.classList.add("desabilitado");
      containerEmails.textContent = "Selecione primeiro um Projeto...";
    }
  });

  // Envia os dados quando o usuário clica em "Enviar"
  form.addEventListener("submit", async function(e) {
    e.preventDefault();
    
    // Coleta todos os checkboxes marcados
    const checkboxesMarcados = document.querySelectorAll('input[name="emailsValidacao"]:checked');
    const listaEmailsSelecionados = Array.from(checkboxesMarcados).map(cb => cb.value);

    if (!selectProjeto.value || listaEmailsSelecionados.length === 0) {
      msgStatus.className = "erro";
      msgStatus.innerText = "Por favor, selecione o Projeto e marque pelo menos um E-mail para validação.";
      msgStatus.style.display = "block";
      return;
    }

    if (!inputSetor.value.trim()) {
      msgStatus.className = "erro";
      msgStatus.innerText = "O campo Setor / Ordem de Serviço (OS) deve estar preenchido para prosseguir.";
      msgStatus.style.display = "block";
      inputSetor.focus();
      return;
    }

    let dadosAnexo = null;
    const arquivoSelecionado = inputAnexo.files[0];
    if (arquivoSelecionado) {
      const tamanhoMB = arquivoSelecionado.size / (1024 * 1024);
      if (tamanhoMB > TAMANHO_MAX_MB) {
        msgStatus.className = "erro";
        msgStatus.innerText = `O anexo excede o limite de ${TAMANHO_MAX_MB} MB.`;
        msgStatus.style.display = "block";
        return;
      }
      dadosAnexo = await lerArquivoComoBase64(arquivoSelecionado);
    }

    btnEnviar.disabled = true;
    btnEnviar.innerText = "Enviando...";
    msgStatus.style.display = "none";

    // Junta os e-mails marcados separados por vírgula (ex: "a@ompower.us, b@ompower.us")
    const payload = {
      solicitante: document.getElementById("solicitante").value,
      projeto: selectProjeto.value,
      emailValidacao: listaEmailsSelecionados.join(", "),
      setor: inputSetor.value,
      centroCusto: inputCentroCusto.value,
      material: document.getElementById("material").value,
      quantidade: document.getElementById("quantidade").value,
      observacoes: document.getElementById("observacoes").value,
      anexo: dadosAnexo
    };

    try {
      const resposta = await fetch(URL_SCRIPT, {
        method: "POST",
        body: JSON.stringify(payload)
      });
      
      const resultado = await resposta.json();

      if (resultado.status === "sucesso") {
        msgStatus.className = "sucesso";
        msgStatus.innerText = `Solicitação enviada com sucesso! Protocolo registrado: ${resultado.protocolo}`;
        msgStatus.style.display = "block";
        
        spanProtocolo.innerText = resultado.protocolo;
        
        form.reset();
        infoAnexo.textContent = `Tamanho máximo recomendado: ${TAMANHO_MAX_MB} MB.`;
        infoAnexo.style.color = "#6c757d";
        
        containerEmails.classList.add("desabilitado");
        containerEmails.textContent = "Selecione primeiro um Projeto...";
      } else {
        throw new Error(resultado.mensagem);
      }
    } catch (erro) {
      msgStatus.className = "erro";
      msgStatus.innerText = "Erro ao enviar solicitação. Tente novamente.";
      msgStatus.style.display = "block";
    } finally {
      btnEnviar.disabled = false;
      btnEnviar.innerText = "Enviar Solicitação";
    }
  });
</script>

</body>
</html>
